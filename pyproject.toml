[project]
name = "movies-be"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi[all,standard]>=0.142.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "sqlmodel>=0.0.47",
]

[tool.fastapi]
app = "app.main:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's Depends() in argument defaults is the supported DI pattern (B008).
"app/routers/*.py" = ["B008"]
# Env must be set before app imports so the test engine uses sqlite://.
"tests/conftest.py" = ["E402"]
# Keep timezone.utc in the NY-boundary upcoming test to match the reviewed snippet.
"tests/test_browse_and_entries.py" = ["UP017"]
